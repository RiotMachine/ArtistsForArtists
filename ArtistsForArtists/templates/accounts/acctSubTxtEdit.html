{% extends "acctTemplate.html" %}

{% block head %}
    {% include "CDNs/EasyMDE.html" %}
{% endblock %}

{% block content %}

<form action="{{ url_for('.subdomainTextEdit') }}" method="post">
    {{ form.csrf_token }}
    
    <fieldset>
        {{ form.newTitle(value=work['title']) }}
    </fieldset>

    <fieldset>
        <textarea name="workText" id="EasyMDEText">{{ work['content'] }}</textarea>
    </fieldset>

    {% for error in form.newTitle.errors %}
    <p class="errorMessage">{{ error }}</p>
    {% endfor %}

    <button class="btn btn-primary w-auto" type="submit">Submit</button>
    <a class="btn btn-secondary w-auto" href="{{ url_for('.subdomainSettings') }}">Reset</a>
</form>

{% endblock %}
