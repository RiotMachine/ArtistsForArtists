{% extends "accounttemplate.html" %}

{% block head %}
<!-- CDN for EasyMDE -->
<!-- https://github.com/Ionaru/easy-markdown-editor -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
<script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
{% endblock %}

{% block main %}
<form action="{{ url_for('subdomainModifyText') }}" method="post">
    {{ form.csrf_token }}
    {{ form.newTitle(value=work['title'], class="form-control w-50") }}
    <div>
        <textarea name="workText"></textarea>
        <script id="workTextQuery" type="application/json">
        {{ work['content'] | tojson }}
        </script>
        <script>
            let JSONtext = document.getElementById('workTextQuery')
            let text = JSON.parse(JSONtext.textContent)
            const easyMDE = new EasyMDE();
            easyMDE.value(text);
        </script>
    </div>
    {% for error in form.newTitle.errors %}
    <p class="errorMessage">{{ error }}</p>
    {% endfor %}
    <div class="col text-center">
        <button class="btn btn-primary w-auto" type="submit">Submit</button>
        <a class="btn btn-secondary w-auto" href="{{ url_for('subdomainSettings') }}">Reset</a>
    </div>
</form>
{% endblock %}
